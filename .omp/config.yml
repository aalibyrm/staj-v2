# Low-budget default: Sol orchestrates; one Luna Max worker executes.
modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  task: openai-codex/gpt-5.6-luna:max
  luna_worker: openai-codex/gpt-5.6-luna:max
  smol: openai-codex/gpt-5.6-luna:low
  tiny: openai-codex/gpt-5.6-luna:low
  commit: openai-codex/gpt-5.6-luna:low

modelProviderOrder:
  - openai-codex

enabledModels:
  - openai-codex/gpt-5.6-sol
  - openai-codex/gpt-5.6-luna

includeModelInPrompt: true

task:
  batch: false
  maxConcurrency: 1
  maxRecursionDepth: 1
  enableEffort: false
  maxEffort: max
  showResolvedModelBadge: true
  agentModelOverrides:
    adaptive-builder: "@luna_worker"
    adaptive-auditor: "@luna_worker"
    adaptive-committer: "@commit"
  isolation:
    mode: none
  softRequestBudget: 50
  softRequestBudgetNotice: true
  agentIdleTtlMs: 120000

async:
  enabled: false

advisor:
  enabled: false
  subagents: false

compaction:
  enabled: true
  strategy: snapcompact
  thresholdPercent: 72
  midTurnEnabled: true

read:
  summarize:
    enabled: true

skills:
  enabled: true
  enableSkillCommands: true
