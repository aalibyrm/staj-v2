# Low-budget default: Sol orchestrates; one Luna Max worker executes.
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  plan: openai-codex/gpt-5.6-sol:medium
  slow: openai-codex/gpt-5.6-sol:medium
  task: openai-codex/gpt-5.6-luna:max
  luna_worker: openai-codex/gpt-5.6-luna:max
  gemini_reviewer: google-antigravity/gemini-3.6-flash:high
  smol: openai-codex/gpt-5.6-luna:low
  tiny: openai-codex/gpt-5.6-luna:low
  commit: openai-codex/gpt-5.6-luna:low

modelProviderOrder:
  - openai-codex
  - google-antigravity

enabledModels:
  - openai-codex/gpt-5.6-sol
  - openai-codex/gpt-5.6-luna
  - google-antigravity/gemini-3.6-flash

includeModelInPrompt: true

task:
  batch: false
  maxConcurrency: 1
  maxRecursionDepth: 1
  enableEffort: false
  maxEffort: max
  showResolvedModelBadge: true
  agentModelOverrides:
    adaptive-builder: "@luna_worker"
    adaptive-auditor: "@gemini_reviewer"
    adaptive-committer: "@commit"
  isolation:
    mode: none
  softRequestBudget: 50
  softRequestBudgetNotice: true
  agentIdleTtlMs: 120000

async:
  enabled: false

advisor:
  enabled: false
  subagents: false

compaction:
  enabled: true
  strategy: snapcompact
  thresholdPercent: 72
  midTurnEnabled: true

read:
  summarize:
    enabled: true

skills:
  enabled: true
  enableSkillCommands: true
