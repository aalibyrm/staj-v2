# Claude-first budget profile: Opus 5 orchestrates, Sonnet 5 builds, Haiku handles tiny work.
modelRoles:
  default: anthropic/claude-opus-5:medium
  plan: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:high
  task: anthropic/claude-sonnet-5:high
  claude_worker: anthropic/claude-sonnet-5:high
  claude_reviewer: anthropic/claude-opus-5:high
  smol: anthropic/claude-haiku-4-5:low
  tiny: anthropic/claude-haiku-4-5:low
  commit: anthropic/claude-sonnet-5:low

modelProviderOrder:
  - anthropic

enabledModels:
  - anthropic/claude-opus-5
  - anthropic/claude-sonnet-5
  - anthropic/claude-haiku-4-5

includeModelInPrompt: true

task:
  batch: false
  maxConcurrency: 1
  maxRecursionDepth: 1
  enableEffort: false
  maxEffort: max
  showResolvedModelBadge: true
  agentModelOverrides:
    adaptive-builder: "@claude_worker"
    adaptive-auditor: "@claude_reviewer"
    adaptive-committer: "@commit"
  isolation:
    mode: none
  softRequestBudget: 50
  softRequestBudgetNotice: true
  agentIdleTtlMs: 120000

async:
  enabled: false

advisor:
  enabled: false
  subagents: false

compaction:
  enabled: true
  strategy: snapcompact
  thresholdPercent: 72
  midTurnEnabled: true

read:
  summarize:
    enabled: true

skills:
  enabled: true
  enableSkillCommands: true
